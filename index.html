<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C24E7E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Дневник мамы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Literata:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF4F6; --card:#FFFFFF; --ink:#3B2A45; --ink-2:#7B6A86; --line:#EADFE6; --line-2:#D6C6D2;
  --accent:#C24E7E; --on-accent:#FFFFFF;
  --rose:#F7D4DF; --peach:#FFD9C7; --butter:#FFE8A8; --mint:#CBEBDD; --sky:#CFE3F5; --lav:#DDD2F4;
  --warn:#B4432F; --ok:#2E7D5B; --tint:#F4E9EF; --shadow:0 8px 22px rgba(90,40,100,.10);
  --sans:'Nunito','Segoe UI','Helvetica Neue',Arial,sans-serif;
  --serif:'Literata','Georgia','Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1B1420; --card:#271D2D; --ink:#F3E9F4; --ink-2:#BBA9C4; --line:#3A2D42; --line-2:#54415E;
    --accent:#F08CB4; --on-accent:#2A1020;
    --rose:#5A3346; --peach:#5C3D36; --butter:#5A4C2A; --mint:#2D4F44; --sky:#2D4660; --lav:#43375F;
    --warn:#F0937F; --ok:#7ED0A5; --tint:#2F2336; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1420; --card:#271D2D; --ink:#F3E9F4; --ink-2:#BBA9C4; --line:#3A2D42; --line-2:#54415E;
  --accent:#F08CB4; --on-accent:#2A1020;
  --rose:#5A3346; --peach:#5C3D36; --butter:#5A4C2A; --mint:#2D4F44; --sky:#2D4660; --lav:#43375F;
  --warn:#F0937F; --ok:#7ED0A5; --tint:#2F2336; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-weight:800;line-height:1.2;margin:0}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0 0 .6em}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 130px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.top-in{max-width:640px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:19px}
.top-r{display:flex;align-items:center;gap:10px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--ink-2)}
.pill.cloud{background:var(--mint);color:var(--ink)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

.banner{margin:6px 0 0;padding:12px 14px;border-radius:16px;background:var(--butter);font-size:14px}
.banner button{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;font-size:14px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:16px}

.greet{margin:10px 0 0;font-size:15px;color:var(--ink-2);font-weight:600}
.hero{position:relative;overflow:hidden;margin-top:10px;border-radius:30px;padding:22px 20px 18px;background:linear-gradient(145deg,var(--peach),var(--lav))}
.hero::before{content:'';position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.28)}
.hero::after{content:'';position:absolute;left:-30px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .small{font-size:14px;font-weight:700;opacity:.8}
.num{font-family:var(--serif);font-weight:700;font-size:clamp(84px,26vw,120px);line-height:.9;letter-spacing:-.04em}
.hero .u{font-weight:800;font-size:19px;margin-top:2px}
.fruit{font-size:clamp(64px,20vw,92px);line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.hero-line{margin:14px 0 10px;font-weight:700}
.prog{height:10px;border-radius:99px;background:rgba(255,255,255,.5);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.prog-l{font-size:13px;font-weight:700;margin-top:6px;opacity:.85}
.sup{font-family:var(--serif);font-style:italic;color:var(--ink-2);margin:14px 4px 0}

.wks{display:flex;gap:7px;overflow-x:auto;margin:14px -16px 0;padding:6px 16px 10px;scrollbar-width:none}
.wks::-webkit-scrollbar{display:none}
.wk{flex:0 0 40px;height:40px;border-radius:50%;border:2px solid transparent;font-weight:800;font-size:14px;position:relative;background:var(--rose)}
.wk.t2{background:var(--sky)} .wk.t3{background:var(--butter)}
.wk.cur{background:var(--accent);color:var(--on-accent)}
.wk.sel{border-color:var(--ink)}
.wk .d{position:absolute;bottom:-1px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--accent);border:2px solid var(--paper);box-sizing:content-box}
.wk.cur .d{background:var(--on-accent);border-color:var(--accent)}
.hintline{font-size:13px;color:var(--ink-2);margin:0 2px}
.preview-note{margin:8px 2px 0;font-size:14px;color:var(--ink-2)}
.preview-note button{background:none;border:0;color:var(--accent);padding:0;font-weight:700;text-decoration:underline}

.btn{border:2px solid var(--line-2);background:transparent;border-radius:99px;padding:10px 18px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.big{width:100%;padding:14px 18px;font-size:17px;margin-top:16px}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.list{list-style:none;margin:0;padding:0}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0 12px 16px;position:relative}
.row:first-child{border-top:0}
.row::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:3px;background:var(--bar,var(--line-2))}
.row.k-vaccine{--bar:var(--accent)} .row.k-exam{--bar:#E8B93C} .row.k-prep{--bar:#9E86D8} .row.k-tip{--bar:#6FB3DA}
.row .t{font-weight:800}
.row .m{font-size:14px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--tint);color:var(--ink-2);border:0}
.chip.now{background:var(--accent);color:var(--on-accent)}
.chip.warn{background:transparent;border:1.5px solid var(--warn);color:var(--warn)}
.chip.ok{background:var(--mint);color:var(--ink)}
.chip.src{border:1.5px dashed var(--line-2);background:transparent}
.chip.tg{border:2px solid var(--line-2);background:transparent;font-size:14px;padding:5px 13px;color:var(--ink)}
.chip.tg.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{padding:18px 0;color:var(--ink-2)}

.q{border-radius:22px;padding:16px;margin-top:16px;background:var(--lav)}
.q .qt{font-family:var(--serif);font-style:italic;font-size:18px;margin:4px 0 12px}
.vis{border-radius:22px;padding:14px 16px;margin-top:16px;background:var(--mint);display:flex;gap:12px;align-items:center}
.vis .e{font-size:30px}

.month{font-weight:800;font-size:15px;color:var(--ink-2);margin:22px 0 4px}
.entry{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.entry .dt{text-align:center;background:var(--rose);border-radius:16px;padding:6px 0;align-self:start}
.entry .dt b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1}
.entry .dt span{font-size:12px;font-weight:700;color:var(--ink-2)}
.entry .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.entry .wk2{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:2px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.photos img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--tint);display:block}
.acts{display:flex;gap:16px;margin-top:8px}
.acts button{background:none;border:0;padding:0;color:var(--ink-2);font-size:14px;font-weight:600;text-decoration:underline}
.acts button.dg{color:var(--warn)}

.seg{display:flex;background:var(--tint);border-radius:99px;padding:4px;margin:12px 0 4px}
.seg button{flex:1;background:none;border:0;padding:8px 6px;font-size:15px;font-weight:700;border-radius:99px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(90,40,100,.10);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}

.det{padding:4px 0 14px 16px;font-size:15px}
.det .f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.det .f.one{grid-template-columns:1fr}
label.fl{display:block;font-size:13px;font-weight:700;color:var(--ink-2)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;margin-top:3px;color:var(--ink)}
textarea{min-height:130px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;margin-top:8px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{border:0;border-radius:24px;padding:16px 14px;text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;background:var(--rose)}
.tile:nth-child(6n+2){background:var(--mint)} .tile:nth-child(6n+3){background:var(--butter)}
.tile:nth-child(6n+4){background:var(--sky)} .tile:nth-child(6n+5){background:var(--lav)} .tile:nth-child(6n+6){background:var(--peach)}
.tile .e{font-size:30px;line-height:1}
.tile b{display:block;font-weight:800;font-size:16px}
.tile span{font-size:13px;color:var(--ink-2);font-weight:600}
.back{background:none;border:0;padding:6px 0;margin-top:8px;font-weight:700;color:var(--accent)}
.bigbtn{display:block;margin:18px auto 6px;width:190px;height:190px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,var(--rose),var(--accent));color:var(--on-accent);font-weight:800;font-size:20px;box-shadow:var(--shadow)}
.bigbtn small{display:block;font-size:44px;font-family:var(--serif);line-height:1.1}
.bigbtn.run{background:radial-gradient(circle at 35% 30%,var(--butter),#E39A2D);color:#2A1A00}
.centered{text-align:center}
.mood{display:flex;gap:8px;margin-top:10px}
.mood button{flex:1;font-size:26px;padding:6px 0;border-radius:16px;border:2px solid var(--line);background:transparent}
.mood button.on{border-color:var(--accent);background:var(--tint)}
.vote{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line-2);border-radius:99px;background:transparent;padding:4px 12px;font-weight:800}
.vote.on{background:var(--rose);border-color:var(--accent)}
svg.chart{width:100%;height:auto;display:block}
svg.chart .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg.chart .pt{fill:var(--card);stroke:var(--accent);stroke-width:3}
svg.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--sans)}
svg.chart .gl{stroke:var(--line);stroke-width:1}

.ov{position:fixed;inset:0;background:rgba(40,15,50,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:76px;height:76px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:14px;background:var(--tint)}
.thumb button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;z-index:30;max-width:90%;font-size:14px;font-weight:600}
.note{font-size:13px;color:var(--ink-2)}
.stage{border-radius:22px;padding:16px;margin-top:14px;background:var(--b,var(--tint))}
.stage ul{margin:4px 0 10px;padding-left:20px}
.stage li{margin:3px 0}
.onb{padding-top:22px}
.onb .emoji{font-size:56px}
.onb h1{margin:8px 0 10px}
.onb .field{margin-top:14px}
.hint{font-size:13px;color:var(--ink-2);margin-top:6px}
.bar{height:10px;border-radius:99px;background:var(--tint);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.btn{min-height:44px}
.btn.sm{min-height:36px}
.ph{cursor:zoom-in}
.fab-wrap{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:32px;line-height:1;box-shadow:0 8px 22px rgba(194,78,126,.45)}
.fab-item{display:flex;align-items:center;gap:10px;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:99px;padding:10px 18px 10px 12px;font-weight:800;min-height:48px}
.fab-item span{font-size:22px}
.lb{position:fixed;inset:0;background:rgba(15,5,20,.94);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb img{max-width:100%;max-height:78%;object-fit:contain}
.lb .cap{color:#fff;margin-top:12px;font-weight:700;text-align:center;padding:0 16px}
.lb button{position:absolute;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:50%;width:48px;height:48px;font-size:24px}
.lb .x{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.lb .pv{left:8px;top:50%} .lb .nx{right:8px;top:50%}
.alb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.alb button{border:0;padding:0;background:none}
.alb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--tint);display:block}
.search{margin-top:12px}
.star{background:none;border:0;padding:0;font-size:22px;line-height:1;color:var(--accent)}
.sealed{background:var(--lav);border-radius:16px;padding:12px 14px;font-weight:700}
.lovebox{border-radius:22px;padding:14px 16px;margin-top:16px;background:linear-gradient(135deg,var(--rose),var(--peach))}
.lovebox .t{font-family:var(--serif);font-style:italic;white-space:pre-wrap}
.letter{font-family:var(--serif);font-style:italic;font-size:19px;white-space:pre-wrap;line-height:1.6}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.hrt{position:absolute;bottom:-40px;animation:flo 2.8s ease-in forwards}
@keyframes flo{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:1}100%{transform:translateY(-110vh) scale(1.2) rotate(18deg);opacity:0}}
html.big body{font-size:19px} html.big .note,html.big .hint{font-size:15px} html.big .chip{font-size:14px} html.big .tabs button{font-size:13px} html.big .row .m{font-size:16px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.hrt{display:none}}
</style>
</head>
<body>
<div id="top"></div>
<div id="app"></div>
<div id="tabs"></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="lb"></div>
<div id="fx"></div>
<input type="file" id="qp-file" accept="image/*" multiple hidden>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var DAY=86400000;
var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_NOM=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function today0(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function fmtDate(s){var d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function fmtShort(s){var d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()];}
function plural(n,a,b,c){n=Math.abs(n)%100;var n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function dayNum(){return Math.floor(today0().getTime()/DAY);}
function mmss(ms){var s=Math.round(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);}
var $=function(s){return document.querySelector(s);};

/* ---------- content ---------- */
var SRC={ru:'Нац. календарь РУз',intl:'Международные рекомендации'};
var HEALTH=[
 {id:'m_reg',who:'mom',kind:'exam',title:'Встать на учёт к акушеру-гинекологу',from:6,to:12,src:'intl',desc:'Обычно рекомендуют до 12 недель. Спроси в своей клинике, какие анализы и визиты назначены.'},

var COLLS=['meta','entries','checks','foods','kicks','weights','questions','visits','names','bagc'];
var Store={
  mode:'local',base:null,idb:null,mem:new Map(),watchers:[],
  initLocal:function(){
    var self=this;
    return new Promise(function(res){
      try{
        var r=indexedDB.open('mama-diary-v2',1);
        r.onupgradeneeded=function(){r.result.createObjectStore('kv',{keyPath:'k'});};
        r.onsuccess=function(){self.idb=r.result;res();};
        r.onerror=function(){self.idb=null;res();};
        r.onblocked=function(){self.idb=null;res();};
      }catch(e){self.idb=null;res();}
    });
  },
  _tx:function(mode){return this.idb.transaction('kv',mode).objectStore('kv');},
  _lget:function(c,id){
    var self=this;
    if(!this.idb){var v=this.mem.get(c+'/'+id);return Promise.resolve(v?Object.assign({id:id},v):null);}
    return new Promise(function(res,rej){var q=self._tx('readonly').get(c+'/'+id);q.onsuccess=function(){var v=q.result;res(v?Object.assign({id:id},v.data):null);};q.onerror=function(){rej(q.error);};});
  },
  _lset:function(c,id,data){
    var self=this;
    if(!this.idb){this.mem.set(c+'/'+id,data);return Promise.resolve();}
    return new Promise(function(res,rej){var q=self._tx('readwrite').put({k:c+'/'+id,c:c,data:data});q.onsuccess=function(){res();};q.onerror=function(){rej(q.error);};});
  },
  _ldel:function(c,id){
    var self=this;
    if(!this.idb){this.mem.delete(c+'/'+id);return Promise.resolve();}
    return new Promise(function(res,rej){var q=self._tx('readwrite').delete(c+'/'+id);q.onsuccess=function(){res();};q.onerror=function(){rej(q.error);};});
  },
  _llist:function(c){
    var self=this;
    if(!this.idb){var out=[];this.mem.forEach(function(v,k){if(k.indexOf(c+'/')===0)out.push(Object.assign({id:k.slice(c.length+1)},v));});return Promise.resolve(out);}
    return new Promise(function(res,rej){
      var q=self._tx('readonly').getAll(IDBKeyRange.bound(c+'/',c+'/\uffff'));
      q.onsuccess=function(){res(q.result.map(function(v){return Object.assign({id:v.k.slice(c.length+1)},v.data);}));};
      q.onerror=function(){rej(q.error);};
    });
  },
  _emit:function(c){
    var self=this;
    this.watchers.forEach(function(w){if(w.c===c&&self.mode==='local'){self._llist(c).then(w.cb);}});
  },
  _fatal:function(e){return e&&['invalid_argument','not_granted','revoked','capability_disabled','capability_removed'].indexOf(e.code)>=0;},
  _canWriteCloud:function(){
    return this.base.collection('meta').doc('probe').set({t:Date.now()}).then(function(){return true;},function(){return false;});
  },
  degrade:function(){
    var self=this;
    if(this.mode==='local')return Promise.resolve();
    this.mode='local';
    this.watchers.forEach(function(w){try{w.un&&w.un();}catch(e){} w.un=null;});
    this.watchers.forEach(function(w){self._llist(w.c).then(w.cb);});
    App.onDegrade();
    return Promise.resolve();
  },
  get:function(c,id){
    if(this.mode==='cloud'){
      return this.base.collection(c).doc(id).get().then(function(s){return s.exists?Object.assign({id:id},s.data()):null;});
    }
    return this._lget(c,id);
  },
  set:function(c,id,data){
    var self=this;
    if(this.mode==='cloud'){
      return this.base.collection(c).doc(id).set(data).catch(function(e){
        if(self._fatal(e)){
          return self._canWriteCloud().then(function(ok){
            if(ok)throw e;
            return self.degrade().then(function(){return self.set(c,id,data);});
          });
        }
        throw e;
      });
    }
    return this._lset(c,id,data).then(function(){self._emit(c);});
  },
  del:function(c,id){
    var self=this;
    if(this.mode==='cloud'){return this.base.collection(c).doc(id).delete();}
    return this._ldel(c,id).then(function(){self._emit(c);});
  },
  list:function(c){
    if(this.mode==='cloud'){return this.base.collection(c).get().then(function(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});}
    return this._llist(c);
  },
  watch:function(c,cb){
    var self=this,w={c:c,cb:cb,un:null};
    this.watchers.push(w);
    if(this.mode==='cloud'){
      w.un=this.base.collection(c).onSnapshot(function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},function(e){if(self._fatal(e))self.degrade();});
    }else{
      this._llist(c).then(cb);
    }
  }
};

/* ---------- timeline math ---------- */
function phaseInfo(dateStr){
  var p=S.profile;if(!p)return null;
  var d=parse(dateStr);
  if(p.birthDate&&d>=parse(p.birthDate)){
    var b=parse(p.birthDate);
    var m=(d.getFullYear()-b.getFullYear())*12+d.getMonth()-b.getMonth();
    var anchor=new Date(b.getFullYear(),b.getMonth()+m,b.getDate());
    if(anchor>d){m--;anchor=new Date(b.getFullYear(),b.getMonth()+m,b.getDate());}
    var days=Math.round((d-anchor)/DAY);
    var total=Math.round((d-b)/DAY);
    return {kind:'baby',months:m,days:days,total:total,pos:m+days/30.4,tick:m};
  }
  if(p.dueDate){
    var t=Math.round((d-parse(p.dueDate))/DAY)+280;
    if(t<0)return null;
    return {kind:'preg',weeks:Math.floor(t/7),days:t%7,total:t,pos:t/7,tick:Math.floor(t/7)};
  }
  return null;
}
function phaseLabel(i){
  if(!i)return '';
  if(i.kind==='preg')return i.weeks+' '+plural(i.weeks,'неделя','недели','недель')+(i.days?' '+i.days+' '+plural(i.days,'день','дня','дней'):'');
  if(i.total<14)return i.total+' '+plural(i.total,'день','дня','дней');
  if(i.months<3)return Math.floor(i.total/7)+' '+plural(Math.floor(i.total/7),'неделя','недели','недель');
  return i.months+' мес.'+(i.days?' '+i.days+' дн.':'');
}
function nowInfo(){return phaseInfo(iso(today0()));}
function viewPos(info){return S.viewIdx!=null?S.viewIdx:(info?info.tick:0);}
function itemState(it,info,pos){
  var cur;
  if(it.who==='mom'){
    if(!info)return 'later';
    cur=(info.kind==='preg')?pos:999;
  }else{
    if(!info||info.kind==='preg')return 'later';
    cur=pos;
  }
  if(cur>=it.from&&cur<it.to+(it.who==='mom'?1:0))return 'now';
  if(cur>it.to)return 'past';
  var soon=it.who==='mom'?6:1.5;
  if(it.from-cur<=soon&&it.from>cur)return 'soon';
  return 'later';
}
function itemWhen(it){
  if(it.when)return it.when;
  if(it.from===1&&it.to===40)return 'в течение беременности';
  return it.from+'–'+it.to+' нед.';
}
function trimester(w){return w<=13?1:w<=27?2:3;}
function greet(){
  var h=new Date().getHours();
  var g=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  var n=S.profile&&S.profile.momName;
  return g+(n?', '+n:'')+'!';
}

function diaryFiltered(){
  var q=S.q.trim().toLowerCase();
  return S.entries.filter(function(e){
    if(S.tagFilter&&(e.tags||[]).indexOf(S.tagFilter)<0)return false;
    if(S.fav&&!e.fav)return false;
    if(q){if(isSealed(e))return false;var hay=((e.text||'')+' '+(e.tags||[]).join(' ')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
}
function albumHtml(list){
  var items=[];S.albumList=[];

  if(!items.length)return '<div class="card"><p class="empty" style="padding:6px 0">Здесь соберутся все фото из записей. Нажми «+» внизу и выбери «Фото».</p></div>';
  var h='<div class="card">',last='';
  items.forEach(function(it){
    var i=phaseInfo(it.e.date),key=i?(i.kind+i.tick):'x';
    var lab=i?(i.kind==='preg'?i.weeks+'-я неделя':(i.months?i.months+' мес.':'первый месяц')):fmtDate(it.e.date);
    if(key!==last){if(last)h+='</div>';last=key;h+='<div class="month" style="margin-top:14px">'+esc(lab)+'</div><div class="alb">';}

function weightChart(pts){
  if(pts.length<2)return '<p class="empty" style="padding:6px 0">'+(pts.length?'Ещё один замер, и появится график.':'Добавь первый замер, и здесь появится график.')+'</p>';
  var W=320,H=150,px=30,py=18;
  var vals=pts.map(function(p){return parseFloat(p.kg);}).filter(function(v){return isFinite(v);});
  if(vals.length<2)return '';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx===mn){mx+=1;mn-=1;}
  var t0=parse(pts[0].date).getTime(),t1=parse(pts[pts.length-1].date).getTime();if(t1===t0)t1=t0+DAY;
  var xy=pts.map(function(p){var x=px+(parse(p.date).getTime()-t0)/(t1-t0)*(W-px-14),y=py+(1-(parseFloat(p.kg)-mn)/(mx-mn))*(H-py*2);return [x,y,p];});
  var line=xy.map(function(a){return a[0].toFixed(1)+','+a[1].toFixed(1);}).join(' ');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График веса">'+
    '<line class="gl" x1="'+px+'" y1="'+py+'" x2="'+(W-8)+'" y2="'+py+'"/><line class="gl" x1="'+px+'" y1="'+(H-py)+'" x2="'+(W-8)+'" y2="'+(H-py)+'"/>'+
    '<text x="2" y="'+(py+4)+'">'+mx.toFixed(1)+'</text><text x="2" y="'+(H-py+4)+'">'+mn.toFixed(1)+'</text>'+
    '<polyline class="ln" points="'+line+'"/>'+xy.map(function(a){return '<circle class="pt" cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="4"/>';}).join('')+
    '<text x="'+px+'" y="'+(H-2)+'">'+esc(fmtShort(pts[0].date))+'</text><text x="'+(W-8)+'" y="'+(H-2)+'" text-anchor="end">'+esc(fmtShort(pts[pts.length-1].date))+'</text></svg>';
}

/* ---------- photos ---------- */
var photoQ=[],photoActive=0,photoObs=null;
function pump(){while(photoActive<4&&photoQ.length){photoActive++;photoQ.shift()();}}
function loadPhoto(id){
  if(photoCache.has(id))return Promise.resolve(photoCache.get(id));
  var pr=photoPending.get(id);if(pr)return pr;
  pr=new Promise(function(res){
    photoQ.push(function(){
      Store.get('photos',id).then(function(r){if(r&&r.data)photoCache.set(id,{data:r.data,thumb:r.thumb||null});res(photoCache.get(id)||null);},function(){res(null);}).then(function(){photoActive--;pump();});
    });
    pump();
  });
  photoPending.set(id,pr);
  pr.then(function(){photoPending.delete(id);});
  return pr;
}
function setImg(img,id){loadPhoto(id).then(function(p){if(p&&document.contains(img)&&!img.getAttribute('src'))img.src=p.thumb||p.data;});}
function hydratePhotos(){
  if(!photoObs&&typeof IntersectionObserver!=='undefined'){
    photoObs=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){photoObs.unobserve(en.target);setImg(en.target,en.target.getAttribute('data-photo'));}});},{rootMargin:'250px'});
  }
  document.querySelectorAll('img[data-photo]').forEach(function(img){
    if(img.getAttribute('src'))return;
    var id=img.getAttribute('data-photo');
    if(photoCache.has(id)){var p=photoCache.get(id);img.src=p.thumb||p.data;return;}
    if(photoObs)photoObs.observe(img);else setImg(img,id);
  });
}
function scaled(img,max,q){
  var sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
function compress(file){
  var url=URL.createObjectURL(file);
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){
      try{
        var max=1280,q=0.78,out=null,i;
        for(i=0;i<10;i++){var data=scaled(img,max,q);if(data.length<=185000){out=data;break;}if(q>0.5)q-=0.08;else max=Math.round(max*0.8);}
        var th=null,tq=0.72,tm=360;
        for(i=0;i<6;i++){var t=scaled(img,tm,tq);if(t.length<=30000){th=t;break;}tq-=0.1;if(tq<0.4){tq=0.5;tm=Math.round(tm*0.8);}}
        URL.revokeObjectURL(url);
        out?res({data:out,thumb:th}):rej(new Error('big'));
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('load'));};
    img.src=url;
  });
}

function saveFile(name,text,mime){
  var blob=new Blob([text],{type:mime||'application/octet-stream'});
  function dl(){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}if(a.parentNode)a.parentNode.removeChild(a);},1500);}
  var file=null;try{file=new File([blob],name,{type:blob.type});}catch(e){}
  if(file&&navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:name}).then(function(){return true;},function(e){if(e&&e.name==='AbortError')return false;dl();return true;});
  }
  dl();return Promise.resolve(true);
}

function importFile(file){
  if(!file)return;
  var fr=new FileReader();
  fr.onload=function(){
    var j;try{j=JSON.parse(fr.result);}catch(e){toast('Файл не похож на копию дневника.');return;}
    if(!j||j.app!=='mama-diary'||!Array.isArray(j.entries)){toast('Файл не похож на копию дневника.');return;}
    var ch=Promise.resolve(),n=0;
    function put(c,id,data){ch=ch.then(function(){return Store.set(c,id,data);});}
    if(j.profile){var pf=Object.assign({},j.profile);delete pf.id;put('meta','profile',pf);}
    ['entries','foods','kicks','weights','questions','visits','names','bagc'].forEach(function(c){(j[c]||[]).forEach(function(x){if(!x||!x.id)return;var d=Object.assign({},x);delete d.id;put(c,x.id,d);if(c==='entries')n++;});});
    Object.keys(j.checks||{}).forEach(function(id){var d=Object.assign({},j.checks[id]);delete d.id;put('checks',id,d);});
    Object.keys(j.photos||{}).forEach(function(id){var q=j.photos[id];var d=typeof q==='string'?{data:q,thumb:''}:{data:q&&q.data,thumb:(q&&q.thumb)||''};if(d.data){photoCache.delete(id);put('photos',id,d);}});
    ch.then(function(){S.sheet=null;renderSheet();toast('Восстановлено записей: '+n);}).catch(function(){toast('Не удалось восстановить.');});
  };
  fr.onerror=function(){toast('Не удалось прочитать файл.');};
  fr.readAsText(file);
}

    var files=Array.prototype.slice.call(t.files||[]);
    var room=6-s.data.photos.length;
    if(files.length>room){toast('Максимум 6 фото на запись.');files=files.slice(0,Math.max(room,0));}
    syncEntryFields();
    var chain=Promise.resolve();
    compressMany(files).then(function(arr){arr.forEach(function(x){s.data.photos.push(x);});if(S.sheet===s)renderSheet();});
    return;
  }
  if(t.id==='qp-file'){
    var qs=Array.prototype.slice.call(t.files||[]).slice(0,6);
    if(!qs.length)return;
    toast('Готовим фото…');
    compressMany(qs).then(function(arr){t.value='';if(arr.length)openEntry(null,'',arr);});
    return;
  }
  var g=t.getAttribute&&t.getAttribute('data-field');
  if(g){saveCheck(t.getAttribute('data-id'),g,g==='done'?t.checked:t.value);return;}
  var b=t.getAttribute&&t.getAttribute('data-bag');
  if(b){saveCheck('bag_'+b,'done',t.checked);bagDone();return;}
  var ms=t.getAttribute&&t.getAttribute('data-ms');
  if(ms){saveCheck('ms_'+ms,'done',t.checked);return;}
  var bc=t.getAttribute&&t.getAttribute('data-bagc');
  if(bc){var r=S.bagc.filter(function(x){return x.id===bc;})[0];if(r){r.done=t.checked;Store.set('bagc',bc,{text:r.text,done:t.checked}).catch(function(){toast('Не удалось сохранить.');});renderMain();bagDone();}return;}
  var q=t.getAttribute&&t.getAttribute('data-q');
  if(q){var qq=S.questions.filter(function(x){return x.id===q;})[0];if(qq){qq.done=t.checked;Store.set('questions',q,{text:qq.text,done:t.checked,created:qq.created||0}).catch(function(){toast('Не удалось сохранить.');});renderMain();}}
});

var draftT=null;
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='d-q'){S.q=t.value;var el=document.getElementById('dlist');if(el){el.innerHTML=diaryListHtml();hydratePhotos();}return;}
  if(t.id==='e-text'||t.id==='e-date'||t.id==='e-seal'){clearTimeout(draftT);draftT=setTimeout(saveDraft,400);}
});
document.addEventListener('keydown',function(ev){
  if(!S.lb)return;
  if(ev.key==='Escape')closeLb();else if(ev.key==='ArrowRight')navLb(1);else if(ev.key==='ArrowLeft')navLb(-1);
});
var tx0=null;
document.addEventListener('touchstart',function(e){if(S.lb&&e.touches.length===1)tx0=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){if(S.lb&&tx0!=null){var dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)navLb(dx<0?1:-1);}},{passive:true});

/* ---------- boot ---------- */
function startWatchers(){
  Store.watch('meta',function(list){
    var p=list.filter(function(x){return x.id==='profile';})[0];
    S.profile=p||null;S.loveL=list.filter(function(x){return x.id==='love';})[0]||null;S.loveR=list.filter(function(x){return x.id==='loveRemote';})[0]||null;S.love=S.loveL||S.loveR||null;S.booting=false;renderAll();
  });
  Store.watch('entries',function(list){
    S.entries=list.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.updated||0)-(a.updated||0);});
    refresh();
  });
  Store.watch('checks',function(list){var m={};list.forEach(function(x){m[x.id]=x;});S.checks=m;refresh();});
  Store.watch('foods',function(list){S.foods=list.sort(function(a,b){return a.date<b.date?1:-1;});refresh();});
  ['kicks','weights','questions','visits','names','bagc'].forEach(function(c){
    Store.watch(c,function(list){S[c]=list;refresh();});
  });
}
function loadRemoteLove(){
  try{
    fetch('love.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(j&&typeof j==='object'&&!Array.isArray(j))Store.set('meta','loveRemote',j).catch(function(){});
    }).catch(function(){});
  }catch(e){}
}
function boot(){
  if(lsGet('md-big')==='1')document.documentElement.classList.add('big');
  renderAll();
  Store.initLocal().then(function(){
    startWatchers();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    loadRemoteLove();
    try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
  });
}
boot();
})();
</script>
</body>
